<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alcubierre Drive · Babylon.js + WebGPU</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="renderCanvas" touch-action="none"></canvas>

    <header id="titlebar">
      <h1>Alcubierre Warp Drive</h1>
      <p class="sub">Curvature of spacetime · York expansion scalar &theta; = &nabla;&middot;v</p>
      <span id="backend" class="badge">initializing…</span>
    </header>

    <aside id="panel">
      <div class="group">
        <h2>Warp field</h2>
        <label>
          <span>Velocity v<sub>s</sub></span>
          <input id="velocity" type="range" min="0" max="6" step="0.01" value="2.6" />
          <output id="velocity-out"></output>
        </label>
        <label>
          <span>Bubble radius R</span>
          <input id="radius" type="range" min="0.8" max="6" step="0.05" value="2.4" />
          <output id="radius-out"></output>
        </label>
        <label>
          <span>Wall thickness &sigma;</span>
          <input id="sigma" type="range" min="0.4" max="5" step="0.05" value="1.6" />
          <output id="sigma-out"></output>
        </label>
        <label>
          <span>Relief</span>
          <input id="amplitude" type="range" min="0" max="3" step="0.05" value="1.4" />
          <output id="amplitude-out"></output>
        </label>
        <label>
          <span>Mesh resolution</span>
          <input id="resolution" type="range" min="6" max="280" step="1" value="120" />
          <output id="resolution-out"></output>
        </label>
      </div>

      <div class="group">
        <h2>Scene</h2>
        <label class="check"><input id="t-grid" type="checkbox" checked /> Spacetime grid</label>
        <label class="check"><input id="t-bubble" type="checkbox" checked /> Warp bubble</label>
        <label class="check"><input id="t-stars" type="checkbox" checked /> Starfield</label>
        <label class="check"><input id="t-paused" type="checkbox" /> Pause time</label>
      </div>

      <div class="group legend">
        <h2>Expansion scalar</h2>
        <div class="bar"></div>
        <div class="scale">
          <span>contraction &minus;&theta;<br /><em>negative energy</em></span>
          <span>expansion +&theta;<br /><em>normal matter</em></span>
        </div>
      </div>
    </aside>

    <footer id="hint">Drag to orbit · scroll to zoom · the bubble rides the ripples it creates</footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
